name: Android privacy and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - uses: android-actions/setup-android@v3
      - name: Verify offline privacy rules
        run: python3 scripts/check_privacy.py
      - name: Generate CI-only debug signing key
        run: keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=CI Debug' -keyalg RSA -validity 2
      - name: Unit tests, lint and debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug
